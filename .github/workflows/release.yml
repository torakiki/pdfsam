name: release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  os_matrix:
    strategy:
      matrix:
        os: [ macos-latest, macos-15-intel, ubuntu-latest, windows-latest ]
        # Temporary pin: setup-java resolves Liberica 25 to 25.0.5+11, ignoring 25.0.5.0.3+5 that fixes CVE-2026-114820
        include:
          - os: macos-latest
            jdk_file: bellsoft-jdk25.0.5.0.3+5-macos-aarch64-full.tar.gz
            jdk_sha1: 70ee0d4cb5010eb666a05de3adaef16da7fb0041
          - os: macos-15-intel
            jdk_file: bellsoft-jdk25.0.5.0.3+5-macos-amd64-full.tar.gz
            jdk_sha1: 1d95b242496c7861b2d8dac845ca335b140fd552
          - os: ubuntu-latest
            jdk_file: bellsoft-jdk25.0.5.0.3+5-linux-amd64-full.tar.gz
            jdk_sha1: bbb9da2585b2cd294502912513a0753eaf261701
          - os: windows-latest
            jdk_file: bellsoft-jdk25.0.5.0.3+5-windows-amd64-full.zip
            jdk_sha1: a286e459eb9c27aa44bff4484125c51255e922ab
    runs-on: ${{ matrix.os }}
    name: build ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.GPG_SUB_SECRET_KEY }}
          passphrase: ${{ secrets.GPG_SUB_SECRET_KEY_PASSWORD }}
          fingerprint: ${{ secrets.GPG_SUB_FINGERPRINT }}
      - name: Set up Apple certs
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_CERT_P12_PWD }}
      - name: Download JDK
        shell: bash
        env:
          JDK_FILE: ${{ matrix.jdk_file }}
          JDK_SHA1: ${{ matrix.jdk_sha1 }}
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o "$JDK_FILE" "https://github.com/bell-sw/Liberica/releases/download/25.0.5.0.3+5/$JDK_FILE"
          SHA1_CMD=$(command -v sha1sum || echo "shasum -a 1")
          echo "$JDK_SHA1  $JDK_FILE" | $SHA1_CMD -c -
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'jdkfile'
          jdk-file: ${{ runner.temp }}/${{ matrix.jdk_file }}
          java-version: '25.0.5'
          architecture: ${{ runner.arch == 'ARM64' && 'aarch64' || 'x64' }}
          cache: ''
      - name: Print Java version
        run: java -version
      - name: Install gettext on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Install scoop on Windows
        if: matrix.os == 'windows-latest'
        uses: MinoruSekine/setup-scoop@371e1c778465fed5ee2101c415bead47553e1a07 # v5.0.0

      - name: Install gettext on Windows
        if: matrix.os == 'windows-latest'
        run: scoop install gettext

      - name: Add Windows SDK tools to PATH
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $sdkBin = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
            Where-Object { $_.Name -match "^\d" } | Sort-Object Name -Descending | Select-Object -First 1
          $x64 = Join-Path $sdkBin.FullName "x64"
          echo $x64 >> $env:GITHUB_PATH

      - name: Setup Azure Trusted Signing dlib on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $pkg = "Microsoft.Trusted.Signing.Client"
          $version = "1.0.60"
          nuget install $pkg -Version $version -OutputDirectory "$env:RUNNER_TEMP\nuget" -NonInteractive
          $dlib = Get-ChildItem "$env:RUNNER_TEMP\nuget\$pkg.$version" -Recurse -Filter "Azure.CodeSigning.Dlib.dll" |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          echo "AZURE_CODESIGNING_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV

      - name: Create signing metadata file on Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo '${{ secrets.AZURE_SIGNING_METADATA_JSON }}' > $RUNNER_TEMP/signing-metadata.json
          echo "AZURE_SIGNING_METADATA=$RUNNER_TEMP/signing-metadata.json" >> $GITHUB_ENV

      - name: Build
        env:
          APPLEID: ${{ secrets.NOTARIZE_ACCOUNT }}
          APPLEIDPASS: ${{ secrets.NOTERIZE_PWD }}
          TEAMID: ${{ secrets.NOTERIZE_TEAM_ID }}
          PDFSAM_GPG_FINGERPRINT: ${{ secrets.GPG_SUB_FINGERPRINT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: mvn clean install -DskipTests -Drelease --batch-mode
      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          files: |
            pdfsam-basic/target/*.deb
            pdfsam-basic/target/*.dmg
            pdfsam-basic/target/*.zip
            pdfsam-basic/target/*.msi
            pdfsam-basic/target/*.msix
            pdfsam-basic/target/*.tar.gz
            pdfsam-basic/target/*.deb.asc
            pdfsam-basic/target/*.dmg.asc
            pdfsam-basic/target/*.zip.asc
            pdfsam-basic/target/*.msi.asc
            pdfsam-basic/target/*.msix.asc
            pdfsam-basic/target/*.tar.gz.asc

